[metadata]
name = cubecast
version = 0.1.0
description = Readable forecasting for tensor streams with seasonality and regimes
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://doi.org/10.1145/3394486.3403260
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    lmfit>=1.2
    numpy>=1.24
    scikit-learn>=1.2

[options.packages.find]
where = src

[options.extras_require]
plot =
    matplotlib>=3.7
